name: Runtime promotion

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact private candidate tag that passed signing and native verification
        required: true
        type: string
      release_id:
        description: Opaque immutable public runtime release identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified runtime release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: runtime-publication
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Download the exact private candidate bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^runtime-candidate-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+$ ]]
          mkdir candidate
          gh release download "$CANDIDATE_TAG" --dir candidate
      - name: Validate exact bytes and prepare the immutable Release plan
        run: >-
          python packaging/publish.py
          --candidate candidate/candidate.json
          --verification candidate/verification.json
          --artifact-dir candidate
          --release-id "$RELEASE_ID"
          --output publication-plan.json
      - name: Create a token scoped to runtime assets
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RUNTIME_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RUNTIME_PUBLISHER_APP_PRIVATE_KEY }}
          owner: openminion
          repositories: runtime
          permission-contents: write
      - name: Publish the exact immutable public runtime Release
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          test "$(gh api repos/openminion/runtime/immutable-releases --jq .enabled)" = true
          tag=$(python -c 'import json; print(json.load(open("publication-plan.json"))["tag"])')
          title=$(python -c 'import json; print(json.load(open("publication-plan.json"))["title"])')
          mapfile -t assets < <(python -c 'import json; print("\n".join(json.load(open("publication-plan.json"))["assets"]))')
          gh release create "$tag" \
            --repo openminion/runtime \
            --draft \
            --target main \
            --title "$title" \
            --notes "Signed, native-verified OpenMinion runtime executables."
          gh release upload "$tag" \
            --repo openminion/runtime \
            "${assets[@]}" \
            candidate/candidate.json \
            candidate/verification.json
          gh release edit "$tag" --repo openminion/runtime --draft=false --prerelease=false
          test "$(gh api "repos/openminion/runtime/releases/tags/$tag" --jq .immutable)" = true
          {
            echo '## Immutable runtime Release published'
            echo
            echo "- Immutable runtime Release: \`$tag\`"
            echo '- Binary metadata publication: not requested'
            echo '- Next gate: qualify these exact Release bytes with packaged Desktop builds on every supported target and commit the evidence to Desktop main.'
            echo '- After qualification, dispatch the protected OpenMinion runtime-manifests workflow with the exact Release and Desktop evidence identities.'
            echo '- Stable discovery remains pending until the metadata PR passes, is merged with a merge commit, and verify-main succeeds.'
          } >> "$GITHUB_STEP_SUMMARY"
