name: Runtime candidates

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Exact final OpenMinion version requested by the source release
        required: true
        type: string
      source_commit:
        description: Exact full source commit behind the final OpenMinion tag
        required: true
        type: string
      wheel_url:
        description: Exact files.pythonhosted.org URL verified by the source release
        required: true
        type: string
      wheel_sha256:
        description: Exact production PyPI wheel SHA-256
        required: true
        type: string
      desktop_min:
        description: Proposed inclusive Desktop compatibility bound
        required: true
        default: 0.0.0
        type: string
      desktop_max:
        description: Proposed exclusive Desktop compatibility bound
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      WHEEL_URL: ${{ inputs.wheel_url }}
      WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify the release request against PyPI and the immutable source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/openminion/openminion/commits/v${RUNTIME_VERSION}" --jq .sha)" = "$SOURCE_COMMIT"
          python packaging/build.py verify-release \
            --version "$RUNTIME_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --wheel-url "$WHEEL_URL" \
            --wheel-sha256 "$WHEEL_SHA256"
      - name: Download the exact official OpenMinion wheel
        run: >-
          python packaging/build.py download-wheel
          --output-dir wheel
          --version "$RUNTIME_VERSION"
          --source-commit "$SOURCE_COMMIT"
          --wheel-url "$WHEEL_URL"
          --wheel-sha256 "$WHEEL_SHA256"
      - name: Create private candidate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="runtime-candidate-v${RUNTIME_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Runtime candidate $tag" \
            --notes "Private paired-runtime artifacts for native qualification. Not a public release."
          gh release upload "$tag" wheel/*.whl
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    environment: runtime-signing
    env:
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      WHEEL_URL: ${{ inputs.wheel_url }}
      WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
      DESKTOP_MIN: ${{ inputs.desktop_min }}
      DESKTOP_MAX: ${{ inputs.desktop_max }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download exact wheel from private candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir wheel
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*.whl' --dir wheel
      - name: Install pinned build tools
        run: |
          python -m pip install uv==0.9.21
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Verify dependency lock and build paired executables
        shell: bash
        run: |
          wheel=$(find wheel -maxdepth 1 -name 'openminion-*.whl' -print -quit)
          release=(
            --wheel-version "$RUNTIME_VERSION"
            --wheel-url "$WHEEL_URL"
            --wheel-sha256 "$WHEEL_SHA256"
            --source-commit "$SOURCE_COMMIT"
          )
          python packaging/build.py lock --target "${{ matrix.target }}" --wheel "$wheel" "${release[@]}" --check
          python packaging/build.py build --target "${{ matrix.target }}" --wheel "$wheel" "${release[@]}"
          for artifact in dist/openminion-*-${{ matrix.target }}* dist/openminiond-*-${{ matrix.target }}*; do
            case "$artifact" in *.json|*.sha256) continue;; esac
            python packaging/build.py verify --artifact "$artifact"
          done
      - name: Sign and notarize macOS executables
        if: matrix.target == 'macos-arm64'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          certificate="$RUNNER_TEMP/signing-certificate.p12"
          keychain="$RUNNER_TEMP/runtime-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          mkdir "$RUNNER_TEMP/notarization"
          for artifact in dist/openminion-*-macos-arm64 dist/openminiond-*-macos-arm64; do
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$keychain" "$artifact"
            cp "$artifact" "$RUNNER_TEMP/notarization/"
          done
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/notarization" "$RUNNER_TEMP/openminion-runtime.zip"
          xcrun notarytool submit "$RUNNER_TEMP/openminion-runtime.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          for artifact in dist/openminion-*-macos-arm64 dist/openminiond-*-macos-arm64; do
            codesign --verify --strict --verbose=2 "$artifact"
            spctl --assess --type execute --verbose=2 "$artifact"
          done
      - name: Sign Windows executables
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or -not $env:CERTIFICATE_PASSWORD -or -not $env:TIMESTAMP_URL) {
            throw "Windows signing configuration is incomplete"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "signing-certificate.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found" }
          Get-ChildItem dist\openminion*-windows-x86_64.exe | ForEach-Object {
            & $signTool sign /f $certificate /p $env:CERTIFICATE_PASSWORD /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
            & $signTool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
          }
      - name: Bind metadata to final signed bytes
        shell: bash
        run: |
          for artifact in dist/openminion-*-${{ matrix.target }}* dist/openminiond-*-${{ matrix.target }}*; do
            case "$artifact" in *.json|*.sha256) continue;; esac
            python packaging/build.py refresh-artifact --artifact "$artifact"
          done
      - name: Exercise CLI and foreground daemon without network fallback
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          cli=$(find dist -maxdepth 1 -name 'openminion-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          daemon=$(find dist -maxdepth 1 -name 'openminiond-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["wheel"]["version"])' "$cli.json")
          python packaging/smoke.py --cli "$cli" --daemon "$daemon" --version "$version"
      - name: Describe exact private candidate bytes
        shell: bash
        run: |
          cli=$(find dist -maxdepth 1 -name 'openminion-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          daemon=$(find dist -maxdepth 1 -name 'openminiond-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          base="https://github.com/openminion/openminion-packaging/releases/download/${{ needs.prepare.outputs.tag }}"
          case "${{ matrix.target }}" in
            macos-arm64)
              min_os=$(sw_vers -productVersion)
              ;;
            linux-x86_64)
              . /etc/os-release
              min_os=$VERSION_ID
              ;;
            windows-x86_64)
              min_os=$(python -c 'import platform; print(platform.version())')
              ;;
          esac
          min_os=${min_os//$'\r'/}
          test -n "$min_os"
          libc=()
          if [ "${{ matrix.target }}" = "linux-x86_64" ]; then
            min_libc=$(node -p 'process.report.getReport().header.glibcVersionRuntime || ""')
            test -n "$min_libc"
            libc=(--min-libc-version "$min_libc")
          fi
          python packaging/build.py candidate-manifest \
            --cli-artifact "$cli" \
            --daemon-artifact "$daemon" \
            --release-id "candidate.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --source-commit "$SOURCE_COMMIT" \
            --cli-url "$base/$(basename "$cli")" \
            --daemon-url "$base/$(basename "$daemon")" \
            --desktop-min "$DESKTOP_MIN" \
            --desktop-max "$DESKTOP_MAX" \
            --min-os-version "$min_os" \
            "${libc[@]}" \
            --output "dist/candidate-${{ matrix.target }}.json"
      - name: Stage verified candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            dist/openminion-*-${{ matrix.target }}* \
            dist/openminiond-*-${{ matrix.target }}* \
            dist/candidate-${{ matrix.target }}.json

  verify-native:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download exact signed target from the private candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern '*-${{ matrix.target }}*' \
            --dir dist
      - name: Verify macOS signing and Gatekeeper trust on the fresh runner
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          for artifact in dist/openminion-*-macos-arm64 dist/openminiond-*-macos-arm64; do
            case "$artifact" in *.json|*.sha256) continue;; esac
            codesign --verify --strict --verbose=2 "$artifact"
            spctl --assess --type execute --verbose=2 "$artifact"
          done
      - name: Verify Windows Authenticode trust on the fresh runner
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found" }
          Get-ChildItem dist\openminion*-windows-x86_64.exe | ForEach-Object {
            & $signTool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
          }
      - name: Verify metadata, native trust, and runtime behavior on a fresh runner
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          cli=$(find dist -maxdepth 1 -name 'openminion-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          daemon=$(find dist -maxdepth 1 -name 'openminiond-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          python packaging/build.py verify --artifact "$cli"
          python packaging/build.py verify --artifact "$daemon"
          version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["wheel"]["version"])' "$cli.json")
          python packaging/smoke.py --cli "$cli" --daemon "$daemon" --version "$version"
          python packaging/build.py native-verification \
            --target "${{ matrix.target }}" \
            --verification-id "native.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${{ matrix.target }}" \
            --output "verification-${{ matrix.target }}.json"
      - name: Stage fresh-host verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "verification-${{ matrix.target }}.json"

  aggregate:
    needs: [prepare, build, verify-native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download native candidate records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir candidate-records
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern 'candidate-*.json' \
            --dir candidate-records
      - name: Merge one cross-platform candidate identity
        shell: bash
        run: |
          inputs=()
          for record in candidate-records/candidate-*.json; do inputs+=(--input "$record"); done
          python packaging/build.py merge-candidates \
            "${inputs[@]}" \
            --release-id "candidate.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --output candidate.json
      - name: Merge fresh-host native verification evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir verification-records
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern 'verification-*.json' \
            --dir verification-records
          inputs=()
          for record in verification-records/verification-*.json; do inputs+=(--input "$record"); done
          python packaging/build.py merge-verifications "${inputs[@]}" --output verification.json
      - name: Stage aggregate candidate record
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" candidate.json verification.json
      - name: Record the candidate disposition
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo '## Private runtime candidate'
            echo
            echo "- Version: \`$RUNTIME_VERSION\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Candidate tag: \`$CANDIDATE_TAG\`"
            echo '- State: candidate built; stable publication blocked pending signing, notarization, native verification, and Desktop qualification'
          } >> "$GITHUB_STEP_SUMMARY"
