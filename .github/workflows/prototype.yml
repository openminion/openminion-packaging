name: Prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openminion/sophiagraph
          ref: b665812a329546eb0a7336f28b2e00643f93043a
          path: sophiagraph-source
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download exact OpenMinion wheel
        shell: bash
        run: |
          mkdir wheel
          curl --fail --location --silent --show-error \
            https://files.pythonhosted.org/packages/5e/1b/9dbdd72266c972038889c7be10cf41faf81792307a2df184d1a6ee853eb8/openminion-0.0.20-py3-none-any.whl \
            --output wheel/openminion-0.0.20-py3-none-any.whl
          echo "a305a2a89f7fd4c8e43c1eba3268e435c57ab5c02b5042a0d33ea87e180262e7  wheel/openminion-0.0.20-py3-none-any.whl" | sha256sum --check
      - name: Build Windows-compatible Sophiagraph prototype wheel
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1789235469"
        run: |
          python -m pip install build==1.5.0 setuptools==84.0.0 wheel==0.48.0
          python -m build --wheel --no-isolation --outdir wheel sophiagraph-source
          echo "152bc782b4715bd0580d2efee5890608b2a65d031a5559b9adc135f7b0d5115e  wheel/sophiagraph-0.0.10-py3-none-any.whl" | sha256sum --check
      - uses: actions/upload-artifact@v7
        with:
          name: openminion-wheel
          path: wheel/*.whl
          retention-days: 3

  build:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: openminion-wheel
          path: wheel
      - name: Install pinned build tools
        shell: bash
        run: |
          python -m pip install uv==0.9.21
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Verify lock and build
        shell: bash
        run: |
          python packaging/build.py lock --target "${{ matrix.target }}" --wheel wheel/openminion-0.0.20-py3-none-any.whl --dependency-wheel wheel/sophiagraph-0.0.10-py3-none-any.whl --check
          python packaging/build.py build --target "${{ matrix.target }}" --wheel wheel/openminion-0.0.20-py3-none-any.whl --dependency-wheel wheel/sophiagraph-0.0.10-py3-none-any.whl
          artifact="dist/openminion-0.0.20-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then artifact="${artifact}.exe"; fi
          python packaging/build.py verify --artifact "$artifact"
      - name: Prototype launch and offline runtime smoke
        shell: bash
        env:
          OPENMINION_HOME: ${{ runner.temp }}/OpenMinion Home
          OPENMINION_DATA_ROOT: ${{ runner.temp }}/OpenMinion Data
          PYAPP_INSTALL_DIR_OPENMINION: ${{ runner.temp }}/OpenMinion Installed
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          source_artifact="dist/openminion-0.0.20-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then source_artifact="${source_artifact}.exe"; fi
          launch_dir="${{ runner.temp }}/OpenMinion Prototype"
          mkdir -p "$launch_dir"
          artifact="$launch_dir/$(basename "$source_artifact")"
          cp "$source_artifact" "$artifact"
          chmod +x "$artifact"

          host_python=$(command -v python)
          empty_path="${{ runner.temp }}/empty-path"
          mkdir -p "$empty_path"
          start=$("$host_python" -c 'import time; print(time.time_ns())')
          if [ "${{ matrix.target }}" = "macos-arm64" ]; then
            /usr/bin/time -l env PATH="$empty_path" "$artifact" --version
          elif [ "${{ matrix.target }}" = "linux-x86_64" ]; then
            /usr/bin/time -v env PATH="$empty_path" "$artifact" --version
          else
            env PATH="$empty_path" "$artifact" --version
          fi
          first_end=$("$host_python" -c 'import time; print(time.time_ns())')
          env PATH="$empty_path" "$artifact" --help >/dev/null
          warm_end=$("$host_python" -c 'import time; print(time.time_ns())')

          smoke_dir="${{ runner.temp }}/OpenMinion Smoke"
          mkdir -p "$smoke_dir"
          printf '%s\n' '{"agents":{"openminion":{"name":"openminion","provider":"echo"}},"providers":{"echo":{"model":"echo"}}}' > "$smoke_dir/config.json"
          for attempt in first second; do
            env PATH="$empty_path" "$artifact" \
              --home-root "$OPENMINION_HOME" \
              --data-root "$OPENMINION_DATA_ROOT" \
              --config "$smoke_dir/config.json" \
              doctor --json \
              > "$smoke_dir/doctor-$attempt.json" \
              2> "$smoke_dir/doctor-$attempt.stderr"
          done

          "$host_python" - "$start" "$first_end" "$warm_end" "${{ matrix.target }}" "$PYAPP_INSTALL_DIR_OPENMINION" <<'PY'
          import json, pathlib, sys
          start, first_end, warm_end = map(int, sys.argv[1:4])
          print(json.dumps({
              "target": sys.argv[4],
              "first_launch_ms": (first_end - start) / 1_000_000,
              "warm_launch_ms": (warm_end - first_end) / 1_000_000,
              "installed_size_bytes": sum(
                  path.stat().st_size
                  for path in pathlib.Path(sys.argv[5]).rglob("*")
                  if path.is_file()
              ),
          }))
          PY
          "$host_python" - "$smoke_dir" "$OPENMINION_DATA_ROOT" <<'PY'
          import json, pathlib, sys
          smoke_dir, data_root = map(pathlib.Path, sys.argv[1:3])
          for attempt in ("first", "second"):
              payload = json.loads((smoke_dir / f"doctor-{attempt}.json").read_text())
              if not payload["summary"]["ok"]:
                  raise SystemExit(f"doctor {attempt} reported failure")
              stderr = (smoke_dir / f"doctor-{attempt}.stderr").read_text()
              if "storage.schema_drift_detected" in stderr or "Traceback" in stderr:
                  raise SystemExit(f"doctor {attempt} emitted a runtime failure")
          for relative in ("state/openminion.db", "memory/memory.db"):
              if not (data_root / relative).is_file():
                  raise SystemExit(f"missing runtime state: {relative}")
          print("offline runtime smoke passed twice")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: openminion-${{ matrix.target }}-prototype
          path: |
            dist/openminion-0.0.20-${{ matrix.target }}*
            !dist/work-*/**
          retention-days: 3
