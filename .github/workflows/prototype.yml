name: Prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Download exact OpenMinion wheel
        shell: bash
        run: |
          mkdir wheel
          curl --fail --location --silent --show-error \
            https://files.pythonhosted.org/packages/3d/bb/d6268e845a980ebf69052e0b8669edaee161e229c77a4752f506c6e0c6d8/openminion-0.0.19-py3-none-any.whl \
            --output wheel/openminion-0.0.19-py3-none-any.whl
          echo "4c2e7d30c3b993e24834d17e9881889a78987ee2a07f8e503d7f40fdca395112  wheel/openminion-0.0.19-py3-none-any.whl" | sha256sum --check
      - uses: actions/upload-artifact@v7
        with:
          name: openminion-wheel
          path: wheel/openminion-0.0.19-py3-none-any.whl
          retention-days: 3

  build:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: openminion-wheel
          path: wheel
      - name: Install pinned build tools
        shell: bash
        run: |
          python -m pip install uv==0.9.21
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Verify lock and build
        shell: bash
        run: |
          python packaging/build.py lock --target "${{ matrix.target }}" --wheel wheel/openminion-0.0.19-py3-none-any.whl --check
          python packaging/build.py build --target "${{ matrix.target }}" --wheel wheel/openminion-0.0.19-py3-none-any.whl
      - name: Prototype first and warm launch
        shell: bash
        env:
          OPENMINION_HOME: ${{ runner.temp }}/openminion-home
          OPENMINION_DATA_ROOT: ${{ runner.temp }}/openminion-data
          PYAPP_INSTALL_DIR_OPENMINION: ${{ runner.temp }}/openminion-install
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          artifact="dist/openminion-0.0.19-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then artifact="${artifact}.exe"; fi
          host_python=$(command -v python)
          empty_path="${{ runner.temp }}/empty-path"
          mkdir -p "$empty_path"
          start=$("$host_python" -c 'import time; print(time.time_ns())')
          if [ "${{ matrix.target }}" = "macos-arm64" ]; then
            /usr/bin/time -l env PATH="$empty_path" "$artifact" --version
          elif [ "${{ matrix.target }}" = "linux-x86_64" ]; then
            /usr/bin/time -v env PATH="$empty_path" "$artifact" --version
          else
            env PATH="$empty_path" "$artifact" --version
          fi
          first_end=$("$host_python" -c 'import time; print(time.time_ns())')
          env PATH="$empty_path" "$artifact" --help >/dev/null
          warm_end=$("$host_python" -c 'import time; print(time.time_ns())')
          "$host_python" - "$start" "$first_end" "$warm_end" "${{ matrix.target }}" "$PYAPP_INSTALL_DIR_OPENMINION" <<'PY'
          import json, pathlib, sys
          start, first_end, warm_end = map(int, sys.argv[1:4])
          print(json.dumps({
              "target": sys.argv[4],
              "first_launch_ms": (first_end - start) / 1_000_000,
              "warm_launch_ms": (warm_end - first_end) / 1_000_000,
              "installed_size_bytes": sum(
                  path.stat().st_size
                  for path in pathlib.Path(sys.argv[5]).rglob("*")
                  if path.is_file()
              ),
          }))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: openminion-${{ matrix.target }}-prototype
          path: |
            dist/openminion-0.0.19-${{ matrix.target }}*
            !dist/work-*/**
          retention-days: 3
