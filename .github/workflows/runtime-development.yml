name: Runtime development binaries

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Exact final OpenMinion version published to PyPI
        required: true
        type: string
      source_commit:
        description: Exact full source commit behind the final OpenMinion tag
        required: true
        type: string
      wheel_url:
        description: Exact files.pythonhosted.org URL for the production wheel
        required: true
        type: string
      wheel_sha256:
        description: Exact production PyPI wheel SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify the production release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/openminion/openminion/commits/v${{ inputs.runtime_version }}" --jq .sha)" = "${{ inputs.source_commit }}"
          python packaging/build.py verify-release \
            --version "${{ inputs.runtime_version }}" \
            --source-commit "${{ inputs.source_commit }}" \
            --wheel-url "${{ inputs.wheel_url }}" \
            --wheel-sha256 "${{ inputs.wheel_sha256 }}"
      - name: Download the exact production wheel
        run: >-
          python packaging/build.py download-wheel
          --output-dir wheel
          --version "${{ inputs.runtime_version }}"
          --source-commit "${{ inputs.source_commit }}"
          --wheel-url "${{ inputs.wheel_url }}"
          --wheel-sha256 "${{ inputs.wheel_sha256 }}"
      - name: Create the private transfer release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="runtime-development-v${{ inputs.runtime_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Runtime development binaries $tag" \
            --notes "Temporary unsigned all-platform binaries for transfer to the public runtime prerelease."
          gh release upload "$tag" wheel/*.whl
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download the verified wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir wheel
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*.whl' --dir wheel
      - name: Install pinned build tools
        run: |
          python -m pip install uv==0.9.21
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Build and verify paired executables
        shell: bash
        run: |
          wheel=$(find wheel -maxdepth 1 -name 'openminion-*.whl' -print -quit)
          release=(
            --wheel-version "${{ inputs.runtime_version }}"
            --wheel-url "${{ inputs.wheel_url }}"
            --wheel-sha256 "${{ inputs.wheel_sha256 }}"
            --source-commit "${{ inputs.source_commit }}"
          )
          python packaging/build.py lock --target "${{ matrix.target }}" --wheel "$wheel" "${release[@]}" --check
          python packaging/build.py build --target "${{ matrix.target }}" --wheel "$wheel" "${release[@]}"
          for artifact in dist/openminion-*-${{ matrix.target }}* dist/openminiond-*-${{ matrix.target }}*; do
            case "$artifact" in *.json|*.sha256) continue;; esac
            python packaging/build.py verify --artifact "$artifact"
          done
      - name: Exercise the CLI and foreground daemon offline
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          cli=$(find dist -maxdepth 1 -name 'openminion-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          daemon=$(find dist -maxdepth 1 -name 'openminiond-*-${{ matrix.target }}*' ! -name '*.json' ! -name '*.sha256' -print -quit)
          python packaging/smoke.py --cli "$cli" --daemon "$daemon" --version "${{ inputs.runtime_version }}"
      - name: Stage the verified unsigned binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            dist/openminion-*-${{ matrix.target }}* \
            dist/openminiond-*-${{ matrix.target }}*

  complete:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every platform and executable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ inputs.runtime_version }}
        shell: bash
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r \
            --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .assets[].name')
          test -n "$assets"
          for name in \
            "openminion-${VERSION}-macos-arm64" \
            "openminiond-${VERSION}-macos-arm64" \
            "openminion-${VERSION}-linux-x86_64" \
            "openminiond-${VERSION}-linux-x86_64" \
            "openminion-${VERSION}-windows-x86_64.exe" \
            "openminiond-${VERSION}-windows-x86_64.exe"; do
            grep -Fx "$name" <<< "$assets"
            grep -Fx "$name.json" <<< "$assets"
            grep -Fx "$name.sha256" <<< "$assets"
          done
          {
            echo '## Unsigned runtime development binaries ready'
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Private transfer tag: \`$TAG\`"
            echo '- Targets: macOS arm64, Linux x86_64, Windows x86_64'
            echo '- Contents: paired CLI and daemon executables with metadata and checksums'
            echo '- Required next step: transfer to an explicitly unsigned prerelease in openminion/runtime and verify the public downloads'
            echo '- Stable binary manifest: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
